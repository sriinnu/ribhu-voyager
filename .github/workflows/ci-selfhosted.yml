name: CI (self-hosted)

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  verify:
    runs-on: [self-hosted, macOS, ARM64]
    timeout-minutes: 25
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Node
        uses: actions/setup-node@v7
        with:
          node-version: 24

      - name: Install
        run: npm ci

      - name: Typecheck
        run: npm run typecheck

      - name: Build PWA
        run: npm run build

      - name: Tests (SQLite + Docker Postgres/Sandbox)
        run: npm test
